# ---------------------------------------------------------------------------
# Merhav Media Group — company configuration
# Every provider below can be switched to a live one; without the matching API
# key it degrades to the deterministic offline implementation.
# ---------------------------------------------------------------------------
[company]
name = "Merhav Media Group"
seed = 1337

[finance]
start_capital = 2000.0     # USD in the bank on day 1
daily_budget  = 60.0       # ceiling the CFO enforces per day
epc           = 0.06       # affiliate earnings per outbound click
reinvest_rate = 0.35       # share of trailing revenue the CEO puts back in

[providers]
llm       = "mock"         # mock | anthropic          (ANTHROPIC_API_KEY)
llm_model = "claude-sonnet-5"
image     = "mock"         # mock | eromify | http     (EROMIFY_API_KEY / IMAGE_API_KEY)
video     = "mock"         # mock | ffmpeg
voice     = "mock"         # mock | elevenlabs         (ELEVENLABS_API_KEY)
social    = "mock"         # mock | live              (per-platform tokens, see providers/social/live.py)

[unit_costs]
image         = 0.04
video         = 0.02
voice         = 0.02
reply         = 0.002
persona_setup = 1.50

[distribution]
platforms = ["tiktok", "instagram", "youtube", "x", "reddit", "fanvue"]
sfw       = ["tiktok", "instagram", "youtube", "x"]
adult     = ["fanvue"]     # age-gated only, and only when the adult tier is enabled
funnel    = ["fanvue"]     # subscription destination every persona funnels into
subreddit = "test"

[holding]
# The company is a capital allocator with branches, not a content studio. It can
# build a branch from zero, buy one, or sell one — whichever the numbers favour.
#
# Multiples here are ASSUMPTIONS about a market that moves. Content businesses
# have traded roughly 20x-45x monthly profit depending on the year, the niche
# and how clean the earnings are. Put the comps you actually believe here.
enabled            = true
valuation_window   = 30      # days of trailing performance a valuation reads
base_multiple      = 26.0    # x monthly profit, before adjustments
value_per_follower = 0.02    # fallback basis for a branch with no profit yet
transferable_subs  = 50      # recurring subscribers that make an asset sellable
maturity_days      = 90      # below this age, the multiple is discounted
scan_every         = 7       # days between acquisition scans
min_discount       = 0.78    # never bid above this share of our own valuation
max_ticket         = 0.40    # most of the cash one acquisition may consume
cash_reserve       = 400.0   # floor the buyer may never breach
exit_multiple      = 30.0    # sell into an offer at or above this multiple
exit_flat_growth   = 0.06    # ...once growth has fallen below this
credible_uplift    = 3.0     # how much more we believe we can earn from an
                             # acquired audience than its seller did. Above this,
                             # the valuation is flagged as an untested assumption
                             # rather than reported as a number.
inherited_conversion = 0.30  # how well an acquired audience converts on day one,
                             # relative to one you built. Recovers ~15pp a month.
                             # This is the assumption the whole roll-up thesis
                             # rests on, and it is the one to argue with first.

[simulation]
# ---------------------------------------------------------------------------
# These are ASSUMPTIONS, not measurements. They are the only thing standing
# between the dashboard and a fantasy, so they live here in the open where they
# can be argued with — and replaced with your own numbers the moment a live
# account produces any. They are set deliberately conservative: most posts from
# a new account are seen by almost nobody.
# ---------------------------------------------------------------------------
audience_cap = 120000.0    # addressable followers per persona per platform
luck_sigma   = 0.65        # spread of the per-post lottery (log-normal)
viral_chance = 0.04        # probability a post breaks out of its follower base
sub_ceiling_share = 0.005  # share of a following that will EVER pay for anything.
                           # The most abusable number in the model: at 5% every
                           # audience becomes a fortune. Half a percent is already
                           # generous for a cold social following.

[simulation.cold_start]    # median impressions a post gets with no following
tiktok = 350
instagram = 110
youtube = 90
x = 40
reddit = 200
fanvue = 15
patreon = 12

[simulation.follow_rate]   # viewers who follow, as a share of impressions
tiktok = 0.006
instagram = 0.005
youtube = 0.004
x = 0.003
reddit = 0.002
fanvue = 0.012
patreon = 0.010

[simulation.click_rate]    # viewers who tap through to the funnel
tiktok = 0.003
instagram = 0.004
youtube = 0.005
x = 0.006
reddit = 0.010
fanvue = 0.060
patreon = 0.050

[portfolio]
# Discovery platforms are a shots-on-goal problem: most new accounts never find
# an audience, and which ones do is not predictable in advance. So the company
# launches a fleet on equal, minimal spend, and only concentrates capital after
# the market has voted.
launch_size     = 10       # personas launched on day one, one niche each
probation_days  = 14       # equal footing for everyone until this age
keep_top        = 3        # survivors of the cull; the rest are paused
slots_probation = 2        # posts/day per persona while on probation
min_views_post  = 250      # a persona below this after probation is culled regardless of rank

[growth]
daily_boost      = 8.0     # default paid-amplification envelope, overridden by the CEO
boost_step       = 2.0     # max spend on a single post
reach_per_dollar = 0.09    # modelled extra reach per dollar of boost
max_roster       = 12      # personas the company will run at once

[policy]
# The adult tier additionally requires AGENCY_ADULT_TIER=1 in the environment,
# so it can never be switched on by a config file alone.
allow_adult_tier = false

[paths]
media = "agency/out/media"
db    = "agency/out/agency.db"
